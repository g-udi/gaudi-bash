name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Releases are cut by hand: Actions > CI > Run workflow, on main, with the kind of bump
  workflow_dispatch:
    inputs:
      bump:
        description: Which part of the version to raise for the release
        type: choice
        options: [patch, minor, major]
        default: patch

# Jobs only read the repository, the release job asks for write access on its own
permissions:
  contents: read

# A newer push to a pull request replaces its running checks, runs on main are never cancelled
# Every kind of event has a group of its own, so that a push to main can not replace a release that is waiting
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-22.04, macos-15, macos-26]

    runs-on: ${{ matrix.os }}

    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      with:
        submodules: recursive

    # gaudi-bash needs Bash 4.3 or newer, macOS only ships 3.2 as /bin/bash
    - name: Install a current Bash (macOS)
      if: startsWith(runner.os, 'macOS')
      run: brew install bash

    - name: Show the Bash that runs the tests
      run: bash --version

    - name: Run tests (Linux)
      if: startsWith(runner.os, 'Linux')
      shell: 'script -q -e -c "bash {0}"'
      run: test/run

    - name: Run tests (macOS)
      if: startsWith(runner.os, 'macOS')
      run: script -q /dev/null bash -c 'test/run'

  lint:
    runs-on: ubuntu-24.04

    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      with:
        submodules: recursive

    - name: Install shellcheck
      # The version is the one of the pinned runner image (ubuntu-24.04)
      run: sudo apt-get update && sudo apt-get install -y shellcheck

    - name: Install shfmt
      env:
        SHFMT_VERSION: v3.14.1
        SHFMT_SHA256: 76e77641faa025814b77f153b29796b8e6fa2fca03e0c76a691608b86c7ea7bf
      run: |
        # A pinned release binary, checked against the digest GitHub publishes for it
        mkdir -p "$HOME/.local/bin"
        curl -fsSL -o "$HOME/.local/bin/shfmt" "https://github.com/mvdan/sh/releases/download/${SHFMT_VERSION}/shfmt_${SHFMT_VERSION}_linux_amd64"
        echo "${SHFMT_SHA256}  $HOME/.local/bin/shfmt" | sha256sum --check
        chmod +x "$HOME/.local/bin/shfmt"
        echo "$HOME/.local/bin" >> "$GITHUB_PATH"

    - name: Set up Python
      uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
      with:
        python-version: '3.12'

    - name: Install pre-commit
      run: python3 -m pip install pre-commit==4.2.0

    - name: Run lint
      run: pre-commit run --all-files

  lint-differential:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04

    permissions:
      contents: read
      security-events: write

    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      with:
        submodules: recursive
        fetch-depth: 0

    - name: Differential ShellCheck
      uses: redhat-plumbers-in-action/differential-shellcheck@f51c7c0d32777d00de777131d25918617a246415 # v5.5.7
      with:
        severity: warning

  release:
    # Only a run started by hand on main releases; pushes and pull requests never tag
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    needs: [test, lint]
    runs-on: ubuntu-24.04

    permissions:
      contents: write

    # Releases run one at a time, so that two merges in a row can not compute the same tag
    concurrency:
      group: release
      cancel-in-progress: false

    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      with:
        fetch-depth: 0
        submodules: recursive

    - name: Bump version and create tag
      id: tag
      env:
        BUMP: ${{ inputs.bump }}
      run: |
        # Get latest tag, default to v0.0.0 if none
        LATEST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "v0.0.0")
        echo "Latest tag: $LATEST_TAG"

        # A run that tagged HEAD but failed before publishing can be started again: the release is then made
        # for the tag that is already there, compared against the release before it
        if EXISTING_TAG=$(git describe --tags --exact-match HEAD 2>/dev/null); then
          echo "HEAD is already tagged as $EXISTING_TAG, publishing the release for that tag"
          PREV_TAG=$(git describe --tags --abbrev=0 "${EXISTING_TAG}^" 2>/dev/null || true)
          echo "tag=$EXISTING_TAG" >> "$GITHUB_OUTPUT"
          echo "prev_tag=$PREV_TAG" >> "$GITHUB_OUTPUT"
          exit 0
        fi

        # Parse version components
        VERSION="${LATEST_TAG#v}"
        IFS='.' read -r MAJOR MINOR PATCH <<< "$VERSION"
        case "$BUMP" in
          major) MAJOR=$((MAJOR + 1)); MINOR=0; PATCH=0 ;;
          minor) MINOR=$((MINOR + 1)); PATCH=0 ;;
          *) PATCH=$((PATCH + 1)) ;;
        esac
        NEW_TAG="v${MAJOR}.${MINOR}.${PATCH}"

        echo "New tag: $NEW_TAG"
        echo "tag=$NEW_TAG" >> "$GITHUB_OUTPUT"
        echo "prev_tag=$LATEST_TAG" >> "$GITHUB_OUTPUT"

        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        git tag -a "$NEW_TAG" -m "Release $NEW_TAG"
        git push origin "$NEW_TAG"

    - name: Generate release notes
      id: notes
      env:
        PREV_TAG: ${{ steps.tag.outputs.prev_tag }}
      run: |
        # Without an earlier release (or tag) the notes hold the whole history
        RANGE="HEAD"
        if [ -n "$PREV_TAG" ] && git rev-parse -q --verify "refs/tags/$PREV_TAG" >/dev/null; then
          RANGE="${PREV_TAG}..HEAD"
        fi
        echo "body<<NOTES_EOF" >> "$GITHUB_OUTPUT"
        git log --no-merges --format="- %s (%h)" "$RANGE" >> "$GITHUB_OUTPUT"
        echo "NOTES_EOF" >> "$GITHUB_OUTPUT"

    - name: Create GitHub Release
      uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
      with:
        tag_name: ${{ steps.tag.outputs.tag }}
        body: ${{ steps.notes.outputs.body }}
        generate_release_notes: false
