name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Jobs only read the repository, the release job asks for write access on its own
permissions:
  contents: read

# A newer push to a pull request replaces its running checks, runs on main are never cancelled
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-22.04, macos-15, macos-26]

    runs-on: ${{ matrix.os }}

    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      with:
        submodules: recursive

    - name: Run tests (Linux)
      if: startsWith(runner.os, 'Linux')
      shell: 'script -q -e -c "bash {0}"'
      run: test/run

    - name: Run tests (macOS)
      if: startsWith(runner.os, 'macOS')
      run: script -q /dev/null bash -c 'test/run'

  lint:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      with:
        submodules: recursive

    - name: Install shellcheck
      run: sudo apt-get update && sudo apt-get install -y shellcheck

    - name: Install shfmt
      env:
        SHFMT_VERSION: v3.14.1
        SHFMT_SHA256: 76e77641faa025814b77f153b29796b8e6fa2fca03e0c76a691608b86c7ea7bf
      run: |
        # A pinned release binary, checked against the digest GitHub publishes for it
        mkdir -p "$HOME/.local/bin"
        curl -fsSL -o "$HOME/.local/bin/shfmt" "https://github.com/mvdan/sh/releases/download/${SHFMT_VERSION}/shfmt_${SHFMT_VERSION}_linux_amd64"
        echo "${SHFMT_SHA256}  $HOME/.local/bin/shfmt" | sha256sum --check
        chmod +x "$HOME/.local/bin/shfmt"
        echo "$HOME/.local/bin" >> "$GITHUB_PATH"

    - name: Set up Python
      uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
      with:
        python-version: '3.12'

    - name: Install pre-commit
      run: python3 -m pip install pre-commit

    - name: Run lint
      run: pre-commit run --all-files

  lint-differential:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest

    permissions:
      contents: read
      security-events: write

    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      with:
        submodules: recursive
        fetch-depth: 0

    - name: Differential ShellCheck
      uses: redhat-plumbers-in-action/differential-shellcheck@f51c7c0d32777d00de777131d25918617a246415 # v5.5.7
      with:
        severity: warning

  release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [test, lint]
    runs-on: ubuntu-latest

    permissions:
      contents: write

    # Releases run one at a time, so that two merges in a row can not compute the same tag
    concurrency:
      group: release
      cancel-in-progress: false

    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      with:
        fetch-depth: 0
        submodules: recursive

    - name: Bump version and create tag
      id: tag
      run: |
        # Get latest tag, default to v0.0.0 if none
        LATEST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "v0.0.0")
        echo "Latest tag: $LATEST_TAG"

        # Check if HEAD is already tagged
        if git describe --exact-match HEAD 2>/dev/null; then
          echo "HEAD is already tagged, skipping"
          echo "skip=true" >> "$GITHUB_OUTPUT"
          exit 0
        fi

        # Parse version components
        VERSION="${LATEST_TAG#v}"
        IFS='.' read -r MAJOR MINOR PATCH <<< "$VERSION"
        PATCH=$((PATCH + 1))
        NEW_TAG="v${MAJOR}.${MINOR}.${PATCH}"

        echo "New tag: $NEW_TAG"
        echo "tag=$NEW_TAG" >> "$GITHUB_OUTPUT"
        echo "prev_tag=$LATEST_TAG" >> "$GITHUB_OUTPUT"
        echo "skip=false" >> "$GITHUB_OUTPUT"

        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        git tag -a "$NEW_TAG" -m "Release $NEW_TAG"
        git push origin "$NEW_TAG"

    - name: Generate release notes
      if: steps.tag.outputs.skip != 'true'
      id: notes
      run: |
        echo "body<<NOTES_EOF" >> "$GITHUB_OUTPUT"
        git log --no-merges --format="- %s (%h)" "${{ steps.tag.outputs.prev_tag }}..HEAD" >> "$GITHUB_OUTPUT"
        echo "NOTES_EOF" >> "$GITHUB_OUTPUT"

    - name: Create GitHub Release
      if: steps.tag.outputs.skip != 'true'
      uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
      with:
        tag_name: ${{ steps.tag.outputs.tag }}
        body: ${{ steps.notes.outputs.body }}
        generate_release_notes: false
